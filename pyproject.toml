[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "vaquill-mcp"
dynamic = ["version"]
description = "MCP server for the Vaquill legal research API - search US federal and 50-state statutes, regulations, constitutions, and court rules via AI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Vaquill", email = "dev@vaquill.ai" },
]
keywords = ["mcp", "legal", "research", "vaquill", "ai", "rag", "law", "statutes", "regulations", "us"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    # UPPER BOUND IS LOAD-BEARING. This was `fastmcp>=3.0.0` with no ceiling,
    # so every fresh install silently resolved to whatever major had shipped
    # most recently while the lockfile, the dev venv and the only tests stayed
    # on 3.1.0. fastmcp 4.0 removed the `fastmcp.tools.tool` submodule, which
    # meant the suite was green locally and the built wheel would not import on
    # a clean machine. A lockfile does not constrain anyone installing the
    # published wheel; only this line does.
    "fastmcp>=4.0.1,<5",
    # httpx2, the fork fastmcp 4 requires. The old `httpx` is still pulled in
    # transitively and is what respx builds test responses from, but nothing in
    # this package imports it any more.
    "httpx2>=2.12.0",
]

[project.scripts]
vaquill-mcp = "vaquill_mcp.__main__:main"
vaquill-mcp-remote = "vaquill_mcp.remote_main:main"

[project.urls]
Homepage = "https://www.vaquill.ai"
Documentation = "https://www.vaquill.ai/docs/api-reference/"
Repository = "https://github.com/Vaquill-AI/vaquill-mcp"
Issues = "https://github.com/Vaquill-AI/vaquill-mcp/issues"
Changelog = "https://github.com/Vaquill-AI/vaquill-mcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
remote = [
    "uvicorn>=0.30.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    # respx targets httpcore; the package now uses httpx2, which is httpcore2.
    # This plugin is respx pointed at httpcore2, and without it every mock in
    # the suite silently misses and the tests make REAL network calls.
    "pytest-httpx2>=1.0.0",
]

[tool.hatch.version]
path = "src/vaquill_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vaquill_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
